# clappkit declares the four clatch crates over `ssh://git@github.com/arfium/clatch.git`,
# but src-tauri/Cargo.toml [patch]es that source to the copy vendored in vendor/clatch
# (PLAYBOOK §8), so a normal build never touches that remote. This stays because libgit2
# cannot use this machine's ssh-agent; on the rare day something DOES fetch from git —
# e.g. refreshing the vendor copy — let cargo spawn the real git CLI.
[net]
git-fetch-with-cli = true

# scripts/with-clatch-deps.* still exists as a fallback: it rewrites the ssh remote to
# HTTPS in the environment for one command, which is only needed if the [patch] is ever
# removed or being refreshed. vendor/ is the primary path.
