# Push a v* tag and this builds one .clapp per platform and publishes them.
#
# PLAYBOOK §6: distribution is a tag, not a folder. A .clapp is per-OS-arch, so a release
# is one depot per platform, each carrying its own rewritten `connector.cliBin`.
#
# Note what this workflow does NOT need: a secret. clappkit carries clapp-ipc and clapp-pipe
# as in-tree crates, so there is no private dependency to reach and nothing to vendor
# (PLAYBOOK §8: a dependency you cannot reach is not a dependency — the SDK solved it at
# the source). Checkout with submodules is the whole story.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive   # clappkit is the foundation, not an optional extra

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # rust-cache does not save on a failed run, so a build that dies never seeds a
          # cache and the next attempt starts from zero — which is most of why a cold
          # Windows build is ~15 minutes (PLAYBOOK §9).
          cache-on-failure: true

      - name: Assert an MSVC host on Windows
        if: runner.os == 'Windows'
        shell: bash
        # AFTER the toolchain action, not before it: this asserts a property of the rustc
        # the build will use, and running it first asked about whatever rustc the image
        # happened to ship — which is what failed the v0.1.0 release run.
        #
        # WebView2: the MSVC toolchain links the LOADER statically, so the depot ships zero
        # DLLs. A -gnu host would need WebView2Loader.dll beside the exe, and the failure is
        # silent (PLAYBOOK §9).
        #
        # NOT `rustc -vV | grep -q`: `grep -q` exits at its first match and closes the pipe,
        # rustc then dies writing to it ("failed printing to stdout ... os error 232"), and
        # this shell runs with `set -o pipefail` — so the pipeline failed precisely WHEN the
        # host matched, and the assert rejected every MSVC runner it exists to accept.
        # `$(...)` reads rustc to the end, so there is no pipe to close early.
        run: |
          rustc -vV
          host=$(rustc -vV | sed -n 's/^host: //p')
          case "$host" in
            *-msvc) echo "host = $host" ;;
            *) echo "::error::not an MSVC host: $host"; exit 1 ;;
          esac

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Windows Defender exclusions
        if: runner.os == 'Windows'
        shell: pwsh
        # Defender scans all ~100k files rustc writes; excluding the workspace and the
        # toolchain is worth roughly a third of the build time on a throwaway VM.
        run: |
          Add-MpPreference -ExclusionPath "${{ github.workspace }}","$HOME\.cargo","$HOME\.rustup" -ErrorAction SilentlyContinue

      - run: npm ci

      - name: Package
        shell: bash
        # `npm run <script>` spawns cmd.exe on Windows, which cannot run a .sh file — so
        # call bash directly rather than going through the npm script (PLAYBOOK §9).
        run: bash scripts/package.sh

      - name: Smoke-test the CLI role
        shell: bash
        # Windows resolves a PE's imports at process start, so an exe with an unsatisfied
        # dependency cannot print --help at all. And `status` MUST fail with the app's own
        # sentence — that proves the CLI got as far as dialling its socket, i.e. the
        # two-surface wiring survived packaging.
        run: |
          CLI_BIN=$(node -p "require('./pkg/clatch.json').connector.cliBin")
          "./pkg/$CLI_BIN" --help | head -n 1
          if "./pkg/$CLI_BIN" status 2>&1 | tee /tmp/out; then
            echo "status must fail with no app running"; exit 1
          fi
          grep -q "not running" /tmp/out

      - uses: actions/upload-artifact@v4
        with:
          name: clapp-${{ matrix.target }}
          path: |
            *.clapp
            *.clapp.sha256

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # No corpus.gtu step here, deliberately. The index is COMMITTED to the repository and
      # copied into every depot by package.sh, so a release carries it inside each .clapp
      # rather than beside them. That removes the failure mode where an app-only release
      # forgets the asset and every new install breaks at first run — and `gturag sync`
      # still fetches the committed one straight from the default branch, so the corpus can
      # be refreshed by a commit, with no release at all.
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.clapp
            dist/*.clapp.sha256
          generate_release_notes: true
