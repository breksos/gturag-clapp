# Push a v* tag and this builds one .clapp per platform and publishes them.
#
# PLAYBOOK §6: distribution is a tag, not a folder. A .clapp is per-OS-arch, so a release
# is one depot per platform, each carrying its own rewritten `connector.cliBin`.
#
# Note what this workflow does NOT need: a secret. clappkit pins the clatch crates over
# SSH, and the reflex is a deploy key in `secrets.*` — which then cannot be used in a
# job-level `if:`, which is how people end up writing a `gate` job to work around it
# (PLAYBOOK §8). The repository is public over HTTPS, so one `insteadOf` rewrite in the
# environment replaces the whole credentials problem.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: url.https://github.com/arfium/clatch.git.insteadOf
  GIT_CONFIG_VALUE_0: ssh://git@github.com/arfium/clatch.git

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive   # clappkit is the foundation, not an optional extra

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable

      # AFTER the toolchain is installed, not before: the question is what will BUILD this,
      # and before this point `rustc` is whatever the runner image happened to ship.
      - name: Assert an MSVC host on Windows
        if: runner.os == 'Windows'
        shell: bash
        # WebView2: the MSVC toolchain links the LOADER statically, so the depot ships zero
        # DLLs. A -gnu host would need WebView2Loader.dll beside the exe, and the failure
        # is silent (PLAYBOOK §9).
        #
        # NOT `rustc -vV | grep -q`: `grep -q` exits at its first match and closes the pipe,
        # rustc then dies writing to it ("failed printing to stdout ... os error 232"), and
        # GitHub's bash runs with `set -o pipefail` — so the pipeline failed precisely WHEN
        # the host matched, and this assert rejected every MSVC runner it was written to
        # accept. `$(...)` reads rustc to the end, so there is no pipe to close early.
        run: |
          host=$(rustc -vV | sed -n 's/^host: //p')
          case "$host" in
            *-msvc) echo "host = $host" ;;
            *) echo "not an MSVC host: $host"; exit 1 ;;
          esac
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # rust-cache does not save on a failed run, so a build that dies never seeds a
          # cache and the next attempt starts from zero — which is most of why a cold
          # Windows build is ~15 minutes (PLAYBOOK §9).
          cache-on-failure: true

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Windows Defender exclusions
        if: runner.os == 'Windows'
        shell: pwsh
        # Defender scans all ~100k files rustc writes; excluding the workspace and the
        # toolchain is worth roughly a third of the build time on a throwaway VM.
        run: |
          Add-MpPreference -ExclusionPath "${{ github.workspace }}","$HOME\.cargo","$HOME\.rustup" -ErrorAction SilentlyContinue

      - run: npm ci

      - name: Install the Clatch CLI
        shell: bash
        # `scripts/package.sh` calls `clatch validate` and `clatch pack`, and nothing else
        # in this job puts either on PATH — so the Package step below died with
        # "clatch: command not found" the moment a build ever got that far.
        #
        # Pinned to the SAME tag clappkit pins the clatch CRATES to. The CLI writes the
        # depot and the library reads it; letting those two drift apart is how a depot
        # packs cleanly on a runner and refuses to install on a human's machine.
        env:
          CLATCH_VERSION: v0.4.3
          GH_TOKEN: ${{ github.token }}
        run: |
          case "${{ runner.os }}" in
            Windows) asset="clatch-$CLATCH_VERSION-x86_64-pc-windows-msvc.zip" ;;
            macOS)   asset="clatch-$CLATCH_VERSION-aarch64-apple-darwin.tar.gz" ;;
            *)       asset="clatch-$CLATCH_VERSION-x86_64-unknown-linux-gnu.tar.gz" ;;
          esac
          mkdir -p "$HOME/clatch-cli"
          cd "$HOME/clatch-cli"
          gh release download "$CLATCH_VERSION" --repo arfium/clatch \
             --pattern "$asset" --pattern "$asset.sha256"
          # The publisher ships a hash beside every archive, so check it: that is the
          # difference between "downloaded something" and "downloaded the release". Only
          # the hash FIELD is compared, deliberately — the checksum file records the path
          # the archive had on the PUBLISHER's machine (`dist/clatch-…tar.gz`), so
          # `sha256sum -c` would go looking for a `dist/` directory that does not exist
          # here and fail on a download that is perfectly good.
          want=$(awk '{print $1}' "$asset.sha256")
          got=$(sha256sum "$asset" 2>/dev/null | awk '{print $1}' \
                || shasum -a 256 "$asset" | awk '{print $1}')
          [ -n "$want" ] && [ "$want" = "$got" ] || {
            echo "clatch checksum mismatch: expected $want, got $got" >&2; exit 1; }
          case "$asset" in
            *.zip) unzip -q "$asset" ;;
            *)     tar -xzf "$asset" ;;
          esac
          # The archive unpacks into a directory NAMED after itself — `clatch` sits inside
          # it, next to an install.sh. Found by search rather than by reconstructing that
          # name, so a change in the publisher's archive layout surfaces as a clear "not
          # found" here instead of a "command not found" three steps later.
          bin=$(find . -name 'clatch' -o -name 'clatch.exe' | head -n 1)
          [ -n "$bin" ] || { echo "no clatch binary inside $asset" >&2; exit 1; }
          chmod +x "$bin" || true
          cd "$(dirname "$bin")"
          echo "$PWD" >> "$GITHUB_PATH"
          ./clatch --version

      - name: Package
        shell: bash
        # `npm run <script>` spawns cmd.exe on Windows, which cannot run a .sh file — so
        # call bash directly rather than going through the npm script (PLAYBOOK §9).
        run: bash scripts/package.sh

      - name: Smoke-test the CLI role
        shell: bash
        # Windows resolves a PE's imports at process start, so an exe with an unsatisfied
        # dependency cannot print --help at all. And `status` MUST fail with the app's own
        # sentence — that proves the CLI got as far as dialling its socket, i.e. the
        # two-surface wiring survived packaging.
        run: |
          CLI_BIN=$(node -p "require('./pkg/clatch.json').connector.cliBin")
          "./pkg/$CLI_BIN" --help | head -n 1
          if "./pkg/$CLI_BIN" status 2>&1 | tee /tmp/out; then
            echo "status must fail with no app running"; exit 1
          fi
          grep -q "not running" /tmp/out

      - uses: actions/upload-artifact@v4
        with:
          name: clapp-${{ matrix.target }}
          path: |
            *.clapp
            *.clapp.sha256

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # No corpus.gtu step here, deliberately. The index is COMMITTED to the repository and
      # copied into every depot by package.sh, so a release carries it inside each .clapp
      # rather than beside them. That removes the failure mode where an app-only release
      # forgets the asset and every new install breaks at first run — and `gturag sync`
      # still fetches the committed one straight from the default branch, so the corpus can
      # be refreshed by a commit, with no release at all.
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.clapp
            dist/*.clapp.sha256
          generate_release_notes: true
